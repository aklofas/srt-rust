name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: test (linux-x86_64, vendored libsrt, MSRV)
    runs-on: ubuntu-latest
    # Pin to MSRV via env so rust-toolchain.toml ("stable" for local dev)
    # doesn't relax the verification done in CI.
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Cache cargo + cmake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Scrub guard (no pre-rename names in tree)
        # Fails the build if any pre-rename name (`srt-core`, `srt-rust`,
        # `TsSender`, `TsReceiver`) or internal codeword (`v0`) leaks into
        # the published tree. CLAUDE.md is the documented exception (per the
        # repo-standalone guardrail); vendor/, target/, and Cargo.lock are
        # excluded. Ubuntu's GHA image ships ripgrep preinstalled.
        run: |
          if rg 'srt[_-]core|srt[_-]rust|TsSender|TsReceiver|\bv0\b' \
              --glob '!target' --glob '!CLAUDE.md' \
              --glob '!**/Cargo.lock' --glob '!vendor'; then
            echo "Pre-rename name regression detected" >&2
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc (no broken intra-doc links)
        env:
          SRT_FORCE_VENDORED: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: cargo test --doc
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo test --doc --workspace

      # `cargo test` only builds the rlib of crates with multiple crate-types.
      # srt-c's smoke test asserts on target/debug/libsrtc.so, so we need an
      # explicit `cargo build` to produce the cdylib + staticlib first.
      - name: cargo build (all crate types, with mbedtls)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo build --workspace

      - name: cargo test (default features, with mbedtls)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo test --workspace

      - name: cargo build (all crate types, no-default-features)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo build --workspace --no-default-features

      - name: cargo test (no-default-features, no encryption)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo test --workspace --no-default-features

      - name: Public-API ratchet (no unintended SemVer breaks)
        # Checks tst-core, tst-pipeline, and tst-srt against the committed
        # public-api.txt baselines. tst-c is excluded: its ABI surface is a
        # C cdylib tracked via tstrans.h (cbindgen); cargo-public-api cannot
        # handle the lib-name/package-name mismatch (lib name "tstrans" ≠
        # package name "tst-c"). To land an intentional SemVer-breaking
        # change, update the relevant crates/<name>/public-api.txt together
        # with the code change so reviewers can audit the delta.
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo +stable install cargo-public-api --locked --quiet
          for crate in tst-core tst-pipeline tst-srt; do
            SRT_FORCE_VENDORED=1 cargo public-api -p $crate --simplified > /tmp/public-api-current-$crate.txt
            if ! diff -u crates/$crate/public-api.txt /tmp/public-api-current-$crate.txt; then
              echo "Public API drift in $crate. Update crates/$crate/public-api.txt or revert the change." >&2
              exit 1
            fi
          done

      - name: non_exhaustive sweep guard
        # Phase 1.2 added #[non_exhaustive] to all public error enums. CI step
        # asserts the count never decreases (additions OK; removals fail the
        # build). On adding a new error enum, bump the BASELINE constant.
        run: |
          BASELINE=37
          OBSERVED=$(rg -c '#\[non_exhaustive\]' crates/ --type rust | awk -F: '{sum += $2} END {print sum}')
          if [ "$OBSERVED" -lt "$BASELINE" ]; then
            echo "non_exhaustive count regressed: expected >= $BASELINE, observed $OBSERVED" >&2
            exit 1
          fi
          echo "non_exhaustive count: $OBSERVED (baseline $BASELINE)"
