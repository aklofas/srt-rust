name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: test (linux-x86_64, vendored libsrt, MSRV)
    runs-on: ubuntu-latest
    # Pin to MSRV via env so rust-toolchain.toml ("stable" for local dev)
    # doesn't relax the verification done in CI.
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Cache cargo + cmake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/debug/incremental
            !target/debug/.fingerprint
            !target/debug/deps
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (default features, with mbedtls)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo test --workspace

      - name: cargo test (no-default-features, no encryption)
        env:
          SRT_FORCE_VENDORED: "1"
        run: cargo test --workspace --no-default-features
