name: jvm-jar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jvm-linux-x86_64:
    name: jvm linux-x86_64 (bootstrap)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # tst-srt builds vendor/srt + vendor/mbedtls (srt wave)

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test JVM binding
        working-directory: bindings/jvm
        env:
          SRT_FORCE_VENDORED: "1"
        run: ./gradlew test --no-daemon --stacktrace

      - name: check-jvm-error-mapping-coverage
        run: bash scripts/check/jvm/error-mapping-coverage.sh
