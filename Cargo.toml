[workspace]
resolver = "2"
members = [
    "crates/srt-sys",
    "crates/tst-core",
    "crates/tst-pipeline",
    "crates/tst-srt",
    "crates/tst-tcp",
    "crates/tst-test-helpers",
    "crates/tst-rtp",
    "crates/tst-udp",
    "crates/tst-c",
    "crates/tst-py",
    "examples",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Andrew Klofas <aklofas@gmail.com>"]
repository   = "https://github.com/aklofas/ts-transformer"

[workspace.dependencies]
libc          = "0.2"
os_socketaddr = "0.2"
bindgen       = "0.72"
cbindgen      = "0.29"
cc            = "1.0"
cmake         = "0.1"
pkg-config    = "0.3"
thiserror     = "1.0"
secrecy       = "0.10"
socket2       = "0.5"
log           = "0.4"
tracing       = { version = "0.1", default-features = false, features = ["std"] }
proptest      = "1"
criterion     = "0.5"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
