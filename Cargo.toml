[workspace]
resolver = "2"
members = [
    "crates/srt-sys",
    "crates/srt-core",
    "crates/srt-c",
]

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Andrew Klofas <aklofas@gmail.com>"]
repository   = "https://github.com/aklofas/srt-rust"

[workspace.dependencies]
libc       = "0.2"
bindgen    = "0.72"
cbindgen   = "0.29"
cc         = "1.0"
cmake      = "0.1"
pkg-config = "0.3"
thiserror  = "1.0"
secrecy    = "0.10"
log        = "0.4"
proptest   = "1"
criterion  = "0.5"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
