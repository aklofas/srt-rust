[workspace]
resolver = "2"
members = [
    # Crates are added here as they're scaffolded.
    # See ../docs/specs/2026-04-29-srt-libraries-design.md for the planned layout:
    #   crates/srt-sys      — libsrt FFI bindings (bindgen against libsrt 1.5.5)
    #   crates/srt-core     — safe Rust API: srt::, klv::, mpegts::, pipeline::
    #   crates/srt-c        — cdylib + cbindgen header (embedded, future Panama)
    #   crates/srt-jni      — JNI bindings, packaged into the Maven JAR
    #   crates/srt-uniffi   — Swift/Kotlin bindings via UniFFI (iOS/Android)
]

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Andrew Klofas <aklofas@gmail.com>"]
repository   = "https://github.com/aklofas/srt-rust"

[workspace.dependencies]
# Centralized version pinning lands here as crates are added.

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
