[package]
name        = "tst-c-core"
description = "Embeddable C-ABI core for tst-c (rlib; no_std-capable)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
doctest = false

[features]
default = ["std", "srt", "rtp", "mbedtls"]
# `std` gates every transport-bearing surface + std-only sinks. The offline
# core (muxer / demuxer / config / error / handle / panic) compiles without it
# (no_std + alloc), for the no_std embedded staticlib path (see
# crates/baremetal-qemu-c/); `std` gates the transport-bearing surface.
std     = ["tst-pipeline/std", "tst-core/std"]
srt     = ["std", "dep:tst-srt"]
rtp     = ["std", "dep:tst-rtp", "dep:secrecy"]
mbedtls = ["tst-srt?/mbedtls"]
udp     = ["std", "dep:tst-udp"]
tcp     = ["std", "dep:tst-tcp"]
hls     = ["std", "dep:tst-tcp", "tst-tcp?/hls"]
rist    = ["std", "dep:tst-rist"]

[dependencies]
tst-srt      = { path = "../../../crates/tst-srt", default-features = false, optional = true }
tst-rtp      = { path = "../../../crates/tst-rtp", default-features = false, optional = true }
tst-udp      = { path = "../../../crates/tst-udp", default-features = false, optional = true }
tst-tcp      = { path = "../../../crates/tst-tcp", default-features = false, optional = true }
tst-rist     = { path = "../../../crates/tst-rist", default-features = false, optional = true }
tst-pipeline = { path = "../../../crates/tst-pipeline", default-features = false }
tst-core     = { path = "../../../crates/tst-core", default-features = false }
libc         = { workspace = true }
thiserror    = { workspace = true }
secrecy      = { workspace = true, optional = true }
critical-section = "1"
spin         = { version = "0.9", default-features = false, features = ["spin_mutex"] }
