[package]
name        = "srt-c"
description = "Stable C ABI binding to the srt-core sender pipeline"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "srtc"
crate-type = ["cdylib", "staticlib"]
doctest    = false

[features]
default = ["mbedtls"]
mbedtls = ["srt-core/mbedtls"]

[dependencies]
srt-core  = { path = "../srt-core", default-features = false }
libc      = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
cc = { workspace = true }
