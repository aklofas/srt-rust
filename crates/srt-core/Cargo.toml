[package]
name        = "srt-core"
description = "Safe Rust API for libsrt — sockets, configuration, error model"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["rlib"]
doctest    = false

[features]
default = ["log", "mbedtls"]
log     = ["dep:log"]
mbedtls = ["srt-sys/mbedtls"]

[dependencies]
srt-sys   = { path = "../srt-sys", default-features = false }
libc      = { workspace = true }
thiserror = { workspace = true }
secrecy   = { workspace = true }
log       = { workspace = true, optional = true }

[dev-dependencies]
libc     = { workspace = true }
proptest = { workspace = true }
