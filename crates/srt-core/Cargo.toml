[package]
name        = "srt-core"
description = "Safe Rust API for libsrt — sockets, configuration, error model"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["rlib"]
doctest    = false

[features]
default = ["log", "mbedtls"]
log     = ["dep:log"]
mbedtls = ["srt-sys/mbedtls"]

[dependencies]
srt-sys   = { path = "../srt-sys", default-features = false }
libc      = { workspace = true }
thiserror = { workspace = true }
secrecy   = { workspace = true }
url       = "2"
log       = { workspace = true, optional = true }
# Used for non-fatal warnings (e.g. ms-vs-µs URL pitfall in srt::url).
# Default features include `attributes`/`std`. We only need `std`;
# consumers attach their own subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
libc      = { workspace = true }
proptest  = { workspace = true }
criterion = { workspace = true }
# Captures `tracing` events in tests for assertion.
tracing-test = "0.2"

[[bench]]
name    = "mux_throughput"
harness = false
