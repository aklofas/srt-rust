[package]
name        = "tst-c"
description = "Stable C ABI binding to the tst-srt sender pipeline"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "tstrans"
crate-type = ["cdylib", "staticlib", "rlib"]
doctest    = false

[features]
default = ["mbedtls"]
mbedtls = ["tst-srt/mbedtls"]

[dependencies]
tst-srt       = { path = "../tst-srt", default-features = false }
tst-core      = { path = "../tst-core" }
tst-pipeline  = { path = "../tst-pipeline" }
libc      = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
cc               = { workspace = true }
cbindgen         = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }
