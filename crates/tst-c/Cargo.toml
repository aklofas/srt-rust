[package]
name        = "tst-c"
description = "Stable C ABI binding to the tst-srt sender pipeline"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "tstrans"
crate-type = ["cdylib", "staticlib", "rlib"]
doctest    = false

[features]
default = ["srt", "rtp", "mbedtls"]
srt     = ["dep:tst-srt"]
rtp     = ["dep:tst-rtp", "dep:secrecy"]
mbedtls = ["tst-srt?/mbedtls"]
# Plan A5a additions — default-off to keep embedded libtstrans.so size
# unchanged for existing SRT-only / RTP-only consumers. Linux distros
# that want everything can `cargo build --features udp,tcp,hls,rist`.
udp     = ["dep:tst-udp"]
tcp     = ["dep:tst-tcp"]
hls     = ["dep:tst-tcp", "tst-tcp?/hls"] # HLS lives in tst-tcp; needs the hls sub-feature
rist    = ["dep:tst-rist"]

[dependencies]
tst-srt      = { path = "../tst-srt", default-features = false, optional = true }
tst-rtp      = { path = "../tst-rtp", default-features = false, optional = true }
tst-udp      = { path = "../tst-udp", default-features = false, optional = true }
tst-tcp      = { path = "../tst-tcp", default-features = false, optional = true }
tst-rist     = { path = "../tst-rist", default-features = false, optional = true }
tst-pipeline = { path = "../tst-pipeline" }
tst-core     = { path = "../tst-core" }
libc      = { workspace = true }
thiserror = { workspace = true }
secrecy   = { workspace = true, optional = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
cc               = { workspace = true }
cbindgen         = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }

# Folder-shaped integration test: Cargo's auto-discovery only walks tests/*.rs
# at the top level, not tests/<dir>/mod.rs. The explicit entry below points it
# at the url_open/ directory so `cargo test -p tst-c --test url_open` keeps
# working post-split.
[[test]]
name = "url_open"
path = "tests/url_open/mod.rs"
