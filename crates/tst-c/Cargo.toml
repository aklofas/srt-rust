[package]
name        = "tst-c"
description = "Stable C ABI binding to the tst-srt sender pipeline"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "tstrans"
crate-type = ["cdylib", "staticlib", "rlib"]
doctest    = false

[features]
default = ["std", "srt", "rtp", "mbedtls"]
# `std` gates every transport-bearing surface + std-only sinks. The offline
# core (muxer / demuxer / config / error / handle / panic) compiles without it
# (no_std + alloc), for the no_std embedded staticlib path (see
# crates/baremetal-qemu-c/); `std` gates the transport-bearing surface.
std     = ["tst-pipeline/std", "tst-core/std"]
srt     = ["std", "dep:tst-srt"]
rtp     = ["std", "dep:tst-rtp", "dep:secrecy"]
mbedtls = ["tst-srt?/mbedtls"]
udp     = ["std", "dep:tst-udp"]
tcp     = ["std", "dep:tst-tcp"]
hls     = ["std", "dep:tst-tcp", "tst-tcp?/hls"]
rist    = ["std", "dep:tst-rist"]

[dependencies]
tst-srt      = { path = "../tst-srt", default-features = false, optional = true }
tst-rtp      = { path = "../tst-rtp", default-features = false, optional = true }
tst-udp      = { path = "../tst-udp", default-features = false, optional = true }
tst-tcp      = { path = "../tst-tcp", default-features = false, optional = true }
tst-rist     = { path = "../tst-rist", default-features = false, optional = true }
tst-pipeline = { path = "../tst-pipeline", default-features = false }
tst-core     = { path = "../tst-core", default-features = false }
libc         = { workspace = true }
thiserror    = { workspace = true }
secrecy      = { workspace = true, optional = true }
critical-section = "1"
spin         = { version = "0.9", default-features = false, features = ["spin_mutex"] }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
cc               = { workspace = true }
cbindgen         = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }
tempfile         = "3"

# Folder-shaped integration test: Cargo's auto-discovery only walks tests/*.rs
# at the top level, not tests/<dir>/mod.rs. The explicit entry below points it
# at the url_open/ directory so `cargo test -p tst-c --test url_open` keeps
# working post-split.
[[test]]
name = "url_open"
path = "tests/url_open/mod.rs"
