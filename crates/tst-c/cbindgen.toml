language = "C"
header = """\
/*
 * tstrans.h — C ABI for ts-transformer (mpeg-ts + KLV + SRT).
 *
 * This file is GENERATED by cbindgen. Do not edit manually.
 * Source of truth: crates/tst-c/src/ (Rust).
 *
 * Copyright (c) 2026 Andrew Klofas. Licensed under MIT OR Apache-2.0.
 */
"""
include_guard = "TSTRANS_H"
pragma_once   = false
no_includes   = false
sys_includes  = ["stddef.h"]
cpp_compat    = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

trailer = """
/* Phase 3 ABI layout guards — trip the C compiler at consumer-build
 * time if the Rust-side struct sizes drift from their Phase 3 baseline.
 * Layouts are pinned in `crates/tst-c/src/event.rs` via const-assertion
 * blocks on the Rust side; this duplicates the guard on the C side so
 * consumers building against an upgraded libtstrans see the mismatch
 * immediately.
 */
#if !defined(TST_SKIP_ABI_ASSERTS) && !defined(_TST_ABI_ASSERTS_DONE)
#define _TST_ABI_ASSERTS_DONE
#define _TST_ABI_ASSERT(c, msg) _Static_assert((c), msg)
_TST_ABI_ASSERT(sizeof(tst_nal_t)                  == 24, "tst_nal_t size drift");
_TST_ABI_ASSERT(sizeof(tst_obu_t)                  == 24, "tst_obu_t size drift");
_TST_ABI_ASSERT(sizeof(tst_descriptor_t)           == 24, "tst_descriptor_t size drift");
_TST_ABI_ASSERT(sizeof(tst_stream_info_t)          == 40, "tst_stream_info_t size drift");
_TST_ABI_ASSERT(sizeof(tst_klv_link_t)             ==  8, "tst_klv_link_t size drift");
_TST_ABI_ASSERT(sizeof(tst_demux_receiver_stats_t) == 48, "tst_demux_receiver_stats_t size drift");
_TST_ABI_ASSERT(sizeof(tst_event_t)               <= 256, "tst_event_t exceeds 256 B");
#endif
"""

[export]
include = [
    "TstError",
    "TstVideoCodec",
    "TstKlvStreamType",
    "TstTsFramingMode",
    "TstOverflowPolicy",
    "TstVideoStreamHandle",
    "TstKlvStreamHandle",
    "TstProgramHandle",
    "TST_INVALID_PROGRAM_HANDLE",
    "TstStreamStats",
    "TstMuxerStats",
    "TstMuxSenderStats",
    "TstSenderStats",
    "TstRawSenderStats",
    "TstRawReceiver",
    "TstManagedRawReceiver",
    "TstRawReceiverStats",
    "TstReceiver",
    "TstManagedReceiver",
    "TstReceiverStats",
    "TST_STATS_MAX_STREAMS",
    # Phase 3: demux receiver surface
    "TstDemuxConfig",
    "TstDemuxReceiver",
    "TstManagedDemuxReceiver",
    "TstDemuxReceiverStats",
    "TstEvent",
    "TstEventKind",
    "TstEventBody",
    "TstEventProgramMap",
    "TstEventSample",
    "TstEventMetadata",
    "TstEventDiscontinuity",
    "TstEventNonConformant",
    "TstNal",
    "TstObu",
    "TstDescriptor",
    "TstStreamInfo",
    "TstKlvLink",
    "TstStreamKindTag",
    "TstMetadataKindTag",
    "TstDiscontinuityKindTag",
    "TstNonConformantCode",
    "TstLinkSource",
    "TstStrictMode",
    "TstAudioCodec",
    "TstSubtitleCodec",
]

[export.rename]
# Enums (repr(C)): no _t suffix, so prefix_with_name produces clean TST_* variant prefixes
"TstError"             = "tst_e"
"TstVideoCodec"        = "tst_video_codec"
"TstKlvStreamType"     = "tst_klv_stream_type"
"TstTsFramingMode"     = "tst_ts_framing_mode"
"TstOverflowPolicy"    = "tst_overflow_policy"
# Opaque handles: idiomatic C _t suffix
"TstMuxer"             = "tst_muxer_t"
"TstMuxConfig"         = "tst_mux_config_t"
"TstMuxSender"         = "tst_mux_sender_t"
"TstManagedMuxSender"  = "tst_managed_mux_sender_t"
"TstSender"            = "tst_sender_t"
"TstManagedSender"     = "tst_managed_sender_t"
"TstRawSender"         = "tst_raw_sender_t"
"TstManagedRawSender"  = "tst_managed_raw_sender_t"
"TstSenderConfig"      = "tst_sender_config_t"
"TstRawSenderConfig"   = "tst_raw_sender_config_t"
"TstReconnectPolicy"   = "tst_reconnect_policy_t"
"TstSenderStats"       = "tst_sender_stats_t"
# Stream handle typedefs (transparent u32; idiomatic C _t suffix)
"TstVideoStreamHandle" = "tst_video_stream_handle_t"
"TstKlvStreamHandle"   = "tst_klv_stream_handle_t"
# Program handle typedef
"TstProgramHandle"     = "tst_program_handle_t"
# Stats structs
"TstStreamStats"       = "tst_stream_stats_t"
"TstMuxerStats"        = "tst_muxer_stats_t"
"TstMuxSenderStats"    = "tst_mux_sender_stats_t"
"TstRawSenderStats"    = "tst_raw_sender_stats_t"
# Receiver handles
"TstRawReceiver"       = "tst_raw_receiver_t"
"TstManagedRawReceiver" = "tst_managed_raw_receiver_t"
"TstRawReceiverStats"  = "tst_raw_receiver_stats_t"
"TstReceiver"          = "tst_receiver_t"
"TstManagedReceiver"   = "tst_managed_receiver_t"
"TstReceiverStats"     = "tst_receiver_stats_t"
# Phase 3: demux receiver handles + stats
"TstDemuxConfig"            = "tst_demux_config_t"
"TstDemuxReceiver"          = "tst_demux_receiver_t"
"TstManagedDemuxReceiver"   = "tst_managed_demux_receiver_t"
"TstDemuxReceiverStats"     = "tst_demux_receiver_stats_t"
# Phase 3: event tagged union + subordinate structs
"TstEvent"                  = "tst_event_t"
"TstNal"                    = "tst_nal_t"
"TstObu"                    = "tst_obu_t"
"TstDescriptor"             = "tst_descriptor_t"
"TstStreamInfo"             = "tst_stream_info_t"
"TstKlvLink"                = "tst_klv_link_t"
# Phase 3: discriminator enums
"TstEventKind"              = "tst_event_kind_t"
"TstStreamKindTag"          = "tst_stream_kind_t"
"TstMetadataKindTag"        = "tst_metadata_kind_t"
"TstDiscontinuityKindTag"   = "tst_discontinuity_kind_t"
"TstNonConformantCode"      = "tst_nonconformant_code_t"
"TstLinkSource"             = "tst_link_source_t"
"TstStrictMode"             = "tst_strict_mode_t"
"TstAudioCodec"             = "tst_audio_codec_t"
"TstSubtitleCodec"          = "tst_subtitle_codec_t"

[enum]
prefix_with_name = true
rename_variants  = "ScreamingSnakeCase"

[fn]
prefix = ""
rename_args = "None"
