[export.rename]
# Enums (repr(C)): no _t suffix, so prefix_with_name produces clean TST_* variant prefixes
"TstError"             = "tst_e"
"TstVideoCodec"        = "tst_video_codec"
"TstKlvStreamType"     = "tst_klv_stream_type"
"TstTsFramingMode"     = "tst_ts_framing_mode"
"TstOverflowPolicy"    = "tst_overflow_policy"
# Opaque handles: idiomatic C _t suffix
"TstMuxer"             = "tst_muxer_t"
"TstMuxConfig"         = "tst_mux_config_t"
"TstMuxSender"         = "tst_mux_sender_t"
"TstManagedMuxSender"  = "tst_managed_mux_sender_t"
"TstSender"            = "tst_sender_t"
"TstManagedSender"     = "tst_managed_sender_t"
"TstRawSender"         = "tst_raw_sender_t"
"TstManagedRawSender"  = "tst_managed_raw_sender_t"
"TstSenderConfig"      = "tst_sender_config_t"
"TstRawSenderConfig"   = "tst_raw_sender_config_t"
"TstReconnectPolicy"   = "tst_reconnect_policy_t"
"TstSenderStats"       = "tst_sender_stats_t"
# Stream handle typedefs (transparent u32; idiomatic C _t suffix)
"TstVideoStreamHandle"    = "tst_video_stream_handle_t"
"TstKlvStreamHandle"      = "tst_klv_stream_handle_t"
"TstAudioStreamHandle"    = "tst_audio_stream_handle_t"
"TstSubtitleStreamHandle" = "tst_subtitle_stream_handle_t"
# Program handle typedef
"TstProgramHandle"     = "tst_program_handle_t"
# Stats structs
"TstStreamStats"       = "tst_stream_stats_t"
"TstMuxerStats"        = "tst_muxer_stats_t"
"TstMuxSenderStats"    = "tst_mux_sender_stats_t"
"TstRawSendStats"    = "tst_raw_send_stats_t"
# Receiver handles
"TstRawReceiver"       = "tst_raw_receiver_t"
"TstManagedRawReceiver" = "tst_managed_raw_receiver_t"
"TstRawRecvStats"  = "tst_raw_recv_stats_t"
"TstReceiver"          = "tst_receiver_t"
"TstManagedReceiver"   = "tst_managed_receiver_t"
"TstReceiverStats"     = "tst_receiver_stats_t"
"TstSocketStats"       = "tst_socket_stats_t"
# Codec-specific stats
"TstStreamCodecStats"       = "tst_stream_codec_stats_t"
"TstStreamCodecStatsUnion"  = "tst_stream_codec_stats_union_t"
"TstCodecStatsUnknown"      = "tst_codec_stats_unknown_t"
"TstCodecStatsVideo"        = "tst_codec_stats_video_t"
"TstCodecStatsKlv"          = "tst_codec_stats_klv_t"
"TstCodecStatsAudio"        = "tst_codec_stats_audio_t"
# Demux receiver handles + stats
"TstDemuxConfig"            = "tst_demux_config_t"
"TstDemuxReceiver"          = "tst_demux_receiver_t"
"TstManagedDemuxReceiver"   = "tst_managed_demux_receiver_t"
"TstDemuxReceiverStats"     = "tst_demux_receiver_stats_t"
# Event tagged union + subordinate structs
"TstEvent"                  = "tst_event_t"
"TstNal"                    = "tst_nal_t"
"TstObu"                    = "tst_obu_t"
"TstDescriptor"             = "tst_descriptor_t"
"TstStreamInfo"             = "tst_stream_info_t"
"TstKlvLink"                = "tst_klv_link_t"
# Discriminator enums — no _t suffix so prefix_with_name yields
# clean TST_EVENT_KIND_* (not TST_EVENT_KIND_T_*)
"TstEventKind"              = "tst_event_kind"
"TstStreamKindTag"          = "tst_stream_kind"
"TstMetadataKindTag"        = "tst_metadata_kind"
"TstDiscontinuityKindTag"   = "tst_discontinuity_kind"
"TstNonConformantCode"      = "tst_nonconformant_code"
"TstPcrMalformedKind"       = "tst_pcr_malformed_kind"
"TstCellFragmentIndication" = "tst_cell_fragment_indication"
"TstMultiCellAuReason"      = "tst_multi_cell_au_reason"
"TstLinkSource"             = "tst_link_source"
"TstStrictMode"             = "tst_strict_mode"
"TstAudioCodec"             = "tst_audio_codec"
"TstSubtitleCodec"          = "tst_subtitle_codec"
"TstAv1CarriageMode"        = "tst_av1_carriage_mode"

[enum]
prefix_with_name = true
rename_variants  = "ScreamingSnakeCase"

[fn]
prefix = ""
rename_args = "None"
