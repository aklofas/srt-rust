[package]
name         = "tst-core"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "TS Transformer core: pure MPEG-TS mux/demux, KLV (MISB ST 0601), codec parameter-set parsers, and transport trait definitions."

[features]
default = ["std", "file"]
# `std` pulls in everything that needs the standard library: file I/O,
# the net helpers, the thread/Barrier cancel path, and the std-only
# serialization deps. Without it the crate is #![no_std] + alloc.
std  = ["file", "serde/std", "tracing/std", "sha2/std", "dep:serde_json", "dep:toml"]
file = ["std"]  # std::fs-using helpers in io_file (must imply std)

[dependencies]
log          = { workspace = true }
thiserror    = { workspace = true }
libc         = { workspace = true }  # raw setsockopt in net::udp_socket (cfg(unix) helpers)
tracing      = { version = "0.1", default-features = false }
serde        = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json   = { version = "1", optional = true }
toml         = { version = "0.8", optional = true }
sha2         = { version = "0.10", default-features = false }
hashbrown    = { version = "0.15", default-features = false, features = ["default-hasher"] }

# IP_MULTICAST_IF on Windows: std::net exposes no setter and libc's socket layer
# is Unix-shaped, so we use socket2's cross-platform setsockopt via SockRef.
# Unix keeps the libc path; only Windows pulls socket2.
[target.'cfg(windows)'.dependencies]
socket2      = { workspace = true }

[dev-dependencies]
proptest         = { workspace = true }
tracing-test     = { version = "0.2", features = ["no-env-filter"] }
tempfile         = "3"
criterion        = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }

[[bench]]
name    = "mux_throughput"
harness = false

[[bench]]
name    = "klv_decode"
harness = false

[[bench]]
name    = "demuxer_ingest"
harness = false

[[bench]]
name    = "codec_parsers"
harness = false

# Maintainer fixture-generators. Build with `cargo run -p tst-core --bin <name>`.
# Not part of the published library surface — they live under tests/tools/ and
# regenerate the fixtures consumed by integration tests.
[[bin]]
name  = "gen_synthetic_fixtures"
path  = "tests/tools/gen_synthetic_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_subtitle_fixtures"
path  = "tests/tools/gen_subtitle_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_h266_fixtures"
path  = "tests/tools/gen_h266_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_av1_fixtures"
path  = "tests/tools/gen_av1_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_pts_rollover_fixture"
path  = "tests/tools/gen_pts_rollover_fixture.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "measure_pcr_jitter"
path  = "tests/tools/measure_pcr_jitter.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "corpus_to_fixture"
