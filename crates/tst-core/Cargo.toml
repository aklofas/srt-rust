[package]
name         = "tst-core"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "TS Transformer core: pure MPEG-TS mux/demux, KLV (MISB ST 0601), codec parameter-set parsers, and transport trait definitions."

[features]
default = ["file"]
file    = []  # gates std::fs-using helpers (added in Task 7)

[dependencies]
log          = { workspace = true }
thiserror    = { workspace = true }
h264-reader  = "0.8"
tracing      = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
proptest         = { workspace = true }
tracing-test     = { version = "0.2", features = ["no-env-filter"] }
tempfile         = "3"
criterion        = { workspace = true }
tst-test-helpers = { path = "../tst-test-helpers" }

[[bench]]
name    = "mux_throughput"
harness = false

[[bench]]
name    = "klv_decode"
harness = false

[[bench]]
name    = "demuxer_ingest"
harness = false

[[bench]]
name    = "codec_parsers"
harness = false

# Maintainer fixture-generators. Build with `cargo run -p tst-core --bin <name>`.
# Not part of the published library surface — they live under tests/tools/ and
# regenerate the fixtures consumed by integration tests.
[[bin]]
name  = "gen_synthetic_fixtures"
path  = "tests/tools/gen_synthetic_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_subtitle_fixtures"
path  = "tests/tools/gen_subtitle_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_h266_fixtures"
path  = "tests/tools/gen_h266_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "gen_av1_fixtures"
path  = "tests/tools/gen_av1_fixtures.rs"
test  = false
bench = false
doc   = false

[[bin]]
name  = "corpus_to_fixture"
path  = "tests/tools/corpus_to_fixture.rs"
