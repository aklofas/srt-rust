[package]
name = "tst-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = []
c = []       # opt-in: exercises the C adapter (needs libtstrans built) — later phase
python = []  # opt-in: exercises the Python adapter (needs the wheel) — later phase

[dependencies]
tst-core = { path = "../tst-core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
sha2       = "0.10"

[dev-dependencies]
tst-test-helpers = { path = "../tst-test-helpers" }
