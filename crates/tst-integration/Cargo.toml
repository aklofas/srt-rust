[package]
name = "tst-integration"
version.workspace = true
edition = "2024"
rust-version = "1.85"
publish = false
description = "Cross-binding scenario harness: golden-envelope contract + scenarios that the Rust, Python, and C adapters all reproduce byte-for-byte, with a gen_scenarios --check drift rail. Not for external consumption."

[features]
default = []
c = []       # opt-in: exercises the C adapter (needs libtstrans built) — later phase
python = []  # opt-in: exercises the Python adapter (needs the wheel) — later phase

[dependencies]
tst-core = { path = "../tst-core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
sha2       = "0.10"
