[package]
name        = "tst-py"
description = "Python bindings (PyO3) for the ts-transformer MPEG-TS + KLV + codec parsers"
# tst-py versions independently from the rest of the workspace
# (per spec: docs/specs/2026-05-22-tst-py-design.md — "tst-py crate
# version is independent of the rest of the workspace; v1 starts at
# 0.1.0"). Keep this in sync with pyproject.toml's `[project] version`.
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name       = "tstrans_native"
crate-type = ["cdylib", "rlib"]
doctest    = false

[features]
default = ["rtp"]
rtp     = ["dep:tst-rtp", "dep:secrecy"]
# Future:
#   v2 will add: srt = ["dep:tst-srt", "dep:tst-pipeline"]

[dependencies]
tst-core = { path = "../tst-core" }
tst-rtp  = { path = "../tst-rtp", default-features = false, optional = true }
pyo3     = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# Wrap user-supplied RTSP passwords in `secrecy::SecretString` at the
# Rust boundary before handing them to `tst_rtp::RtspClientBuilder::auth`.
# Optional + gated on `feature = "rtp"` so non-rtp builds don't pull it.
secrecy  = { workspace = true, optional = true }

[build-dependencies]
# On macOS, PyO3's `extension-module` feature requires the *consuming* crate
# to emit `-undefined dynamic_lookup` so the cdylib links without a Python
# interpreter at link time. `cargo:rustc-cdylib-link-arg` only takes effect
# from the cdylib package's own build script, so PyO3 itself can't do this
# for us. `add_extension_module_link_args()` is the documented helper.
pyo3-build-config = "0.22"
