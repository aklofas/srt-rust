[package]
name        = "tst-rtp"
description = "TS Transformer RTP transport: RTP-over-UDP carrying MPEG-TS (RFC 2250) with RTSP/1.0 + RTSP/2.0 client + server. Pure Rust, no native deps."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "README.md"
keywords    = ["rtp", "rtsp", "mpeg-ts", "streaming"]
categories  = ["multimedia::video", "network-programming"]

[lib]
crate-type = ["rlib"]

[dependencies]
tst-core   = { path = "../tst-core", version = "0.4.0" }
thiserror  = { workspace = true }
base64     = { version = "0.22", default-features = false, features = ["std"] }
bytes      = "1"
# Random SSRC + initial RTP sequence number per RFC 3550 §5.1.
# getrandom is the minimal dep — sized for one-shot construction-time use.
getrandom  = "0.2"
md-5       = { version = "0.10", default-features = false }
sdp-types  = "0.1"
secrecy    = { workspace = true }
sha2       = { version = "0.10", default-features = false }
# Constant-time byte comparison for RTSP auth credential verification.
# Already in the workspace lockfile via rustls; declared direct so auth.rs
# can use ConstantTimeEq without a feature gate.
subtle     = "2"
# Phase 3: tokio drives the RtspServer Runtime (internal-only sync facade).
# Same feature set Phase 2 used as a dev-dep — features carry over.
tokio      = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# CancellationToken for graceful-shutdown coordination across per-session tasks.
tokio-util = { version = "0.7" }
# Single facade for diagnostics workspace-wide.
tracing    = { version = "0.1", default-features = false, features = ["std"] }

# Raw setsockopt for multicast knobs not exposed on stable std::net::UdpSocket
# in Rust 1.85: IPV6_MULTICAST_HOPS and IP_MULTICAST_IF. Unix-only; Phase 1
# returns IfaceUnsupported on non-Unix platforms.
[target.'cfg(unix)'.dependencies]
libc       = { workspace = true }

# IP_MULTICAST_IF on Windows for the RTSP multicast-mount send socket. std/tokio
# expose no setter; socket2's SockRef borrows the tokio UdpSocket and issues the
# cross-platform setsockopt. Unix uses the libc path above.
[target.'cfg(windows)'.dependencies]
socket2    = { workspace = true }

[features]
# tls is deliberately default-OFF: RTSP commonly runs plaintext (rtsps:// is
# the exception, not the rule). Consumers opt in with --features tls.
default = []
# Enable `rtsps://` support. The Phase 2 client uses sync rustls 0.23 directly
# (no tokio-rustls) because the client is a sync facade per master spec; the
# Phase 3 server adds `tokio-rustls` on top because the server is async (tokio
# Runtime), and native async TLS is much cleaner than wiring sync rustls into
# tokio via spawn_blocking.
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
]

[dependencies.rustls]
version          = "0.23"
optional         = true
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-pemfile]
version  = "2"
optional = true

[dependencies.rustls-pki-types]
version  = "1"
optional = true

# Pulls trust roots from the OS / native cert store so `rtsps://` works
# out-of-the-box without webpki-roots being baked into the binary.
[dependencies.rustls-native-certs]
version  = "0.7"
optional = true

# Server-side TLS (Phase 3 Task 11). tokio-rustls 0.26 wraps rustls 0.23
# and exposes a native tokio AsyncRead+AsyncWrite TlsStream + TlsAcceptor;
# server-side handshake is `acceptor.accept(tcp).await` — no spawn_blocking
# bridge needed.
[dependencies.tokio-rustls]
version          = "0.26"
optional         = true
default-features = false
features         = ["ring"]

[dev-dependencies]
tst-pipeline     = { path = "../tst-pipeline" }
tst-test-helpers = { path = "../tst-test-helpers" }
proptest         = { workspace = true }
# Used by server::tls unit tests (negative-path cert loading); matches the
# `tempfile = "3"` pattern from tst-core.
tempfile         = "3"
# Self-signed cert + key generator for Wave F Task 24 TLS integration
# test fixture (`tests/fixtures/tls_certs.rs`). 0.13 is the highest
# version verified against Rust 1.85 (workspace MSRV); 0.14 was released
# 2025-09 and might also work but 0.13 is sufficient for our needs.
rcgen            = "0.13"
# tokio + tokio-util were dev-only in Phase 2 (loopback fixture); promoted
# to production [dependencies] in Phase 3 for the RtspServer Runtime.
