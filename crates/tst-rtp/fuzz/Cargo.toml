[package]
name    = "tst-rtp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tst-rtp       = { path = ".." }

[[bin]]
name              = "rtp_packet_decode"
path              = "fuzz_targets/rtp_packet_decode.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtsp_message_decode"
path              = "fuzz_targets/rtsp_message_decode.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtsp_interleaved_demux"
path              = "fuzz_targets/rtsp_interleaved_demux.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "rtp_h264_depacketize"
path              = "fuzz_targets/rtp_h264_depacketize.rs"
test              = false
doc               = false
bench             = false

[workspace]
members = []
