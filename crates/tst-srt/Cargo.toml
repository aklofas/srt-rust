[package]
name        = "tst-srt"
description = "TS Transformer SRT transport: safe libsrt wrapper, Socket / Listener / Builder, URL parsing, Transport + RecvTransport impls."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
crate-type = ["rlib"]

[features]
default = ["mbedtls"]
mbedtls = ["srt-sys/mbedtls"]

[dependencies]
srt-sys       = { path = "../srt-sys", default-features = false }
tst-core      = { path = "../tst-core" }
libc      = { workspace = true }
thiserror = { workspace = true }
secrecy   = { workspace = true }
url          = "2"
# Single facade for diagnostics workspace-wide. The libsrt log handler
# installed in `init.rs` forwards libsrt syslog levels into tracing
# events with target="srt"; consumers wire one `tracing-subscriber`.
# Default features include `attributes`/`std`. We only need `std`;
# consumers attach their own subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
libc          = { workspace = true }
proptest      = { workspace = true }
tst-pipeline  = { path = "../tst-pipeline" }
# Used by integration tests that read raw libsrt socket flags
# (e.g. SRTO_SENDER) via Socket::raw_handle().
srt-sys   = { path = "../srt-sys", default-features = false }
# Captures `tracing` events in tests for assertion.
# `no-env-filter` makes the subscriber accept events from any crate (not just
# the test binary), which is needed for integration tests that assert on warns
# emitted by tst-core library code.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
