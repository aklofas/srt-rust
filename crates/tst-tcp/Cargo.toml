[package]
name = "tst-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw MPEG-TS over TCP (caller + listener, plain + TLS via rustls) for the tstrans pipeline"

[features]
default = ["tls", "hls"]
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile"]
hls = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:base64",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:rustls",
]

[dependencies]
tst-core   = { path = "../tst-core" }
socket2    = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

[dependencies.rustls]
version          = "0.23"
optional         = true
default-features = false
features         = ["std", "ring"]

[dependencies.rustls-native-certs]
version  = "0.7"
optional = true

[dependencies.rustls-pemfile]
version  = "2"
optional = true

[dependencies.tokio]
version  = "1"
features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "fs"]
optional = true

[dependencies.tokio-util]
version  = "0.7"
optional = true

[dependencies.hyper]
version  = "1.7"
features = ["server", "http1"]
optional = true

[dependencies.hyper-util]
version  = "0.1"
features = ["server", "tokio", "service", "http1"]
optional = true

[dependencies.http-body-util]
version  = "0.1"
optional = true

[dependencies.bytes]
version  = "1"
optional = true

[dependencies.base64]
version  = "0.22"
optional = true

[dependencies.tokio-rustls]
version          = "0.26"
default-features = false
features         = ["ring"]
optional         = true

[dev-dependencies]
tst-pipeline = { path = "../tst-pipeline" }
