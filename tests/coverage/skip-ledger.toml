note = """
The WS-1 CI-hang quarantine. Un-ignored in 0368fc8f and now passes on Linux
x86_64 + aarch64 (run 26607873300). Root cause was the in-session RTSP PLAY
write-lock starvation, fixed by the write_gate in 6de05208. Recorded here so
the ledger preserves the history without normalizing an active skip.
"""

